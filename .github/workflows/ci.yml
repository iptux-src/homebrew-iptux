name: Homebrew CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test ${{ matrix.build }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        build: [stable, head]

    steps:
      - name: Check out tap
        uses: actions/checkout@v4

      - name: Install formula
        run: |
          if [ "${{ matrix.build }}" = "head" ]; then
            brew install --HEAD --build-from-source ./Formula/iptux.rb
          else
            brew install --build-from-source ./Formula/iptux.rb
          fi

      - name: Test formula
        run: brew test iptux
