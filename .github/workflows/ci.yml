name: Homebrew CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test ${{ matrix.build }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        build: [stable, head]

    steps:
      - name: Check out tap
        uses: actions/checkout@v4

      - name: Configure local tap
        run: |
          brew tap-new --no-git iptux-src/iptux
          cp Formula/iptux.rb \
            "$(brew --repository)/Library/Taps/iptux-src/homebrew-iptux/Formula/iptux.rb"

      - name: Install formula
        run: |
          if [ "${{ matrix.build }}" = "head" ]; then
            brew install gobject-introspection
            brew install --HEAD --build-from-source iptux-src/iptux/iptux
          else
            brew install --build-from-source iptux-src/iptux/iptux
          fi

      - name: Test formula
        run: brew test iptux-src/iptux/iptux
